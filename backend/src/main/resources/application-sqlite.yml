spring:
  datasource:
    url: jdbc:sqlite:../data/orgflow.db
    driver-class-name: org.sqlite.JDBC
    username: sa
    password: sa
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true

orgflow:
  security:
    dev-auth:
      username: ${DEV_AUTH_USERNAME:dev@orgflow.local}
      password: ${DEV_AUTH_PASSWORD:}
  seed:
    enabled: true
