name: Labeler

on:
    pull_request_target:
        types: [opened, synchronize, reopened]

permissions:
    contents: read

jobs:
    label:
        name: Apply path labels
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Label pull request
              uses: actions/labeler@v7
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  configuration-path: .github/labeler.yml
