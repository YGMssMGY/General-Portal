spring:
  datasource:
    url: jdbc:sqlite:../data/general-portal.db
    driver-class-name: org.sqlite.JDBC
    username: sa
    password: sa
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

general-portal:
  security:
    dev-auth:
      username: ${DEV_AUTH_USERNAME:dev@generalportal.local}
      password: ${DEV_AUTH_PASSWORD:devpass123}
  seed:
    enabled: true
