name: Greetings

on:
    issues:
        types: [opened]
    pull_request_target:
        types: [opened]

permissions:
    contents: read

jobs:
    greeting:
        name: Welcome first-time contributors
        runs-on: ubuntu-latest
        permissions:
            issues: write
            pull-requests: write
        steps:
            - name: Welcome first-time contributor
              uses: actions/first-interaction@v3
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  issue-message: Thank you for your first issue. A maintainer will review it shortly.
                  pr-message: Thank you for your first pull request. Please confirm that pnpm verify passes locally before requesting review.
