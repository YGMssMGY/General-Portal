name: CI

on:
    push:
        branches: [main, "feat/**"]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        name: Format, lint, typecheck, build
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up pnpm
              uses: pnpm/action-setup@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.12
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Check formatting
              run: pnpm exec oxfmt --check .
            - name: Lint
              run: pnpm lint
            - name: Typecheck
              run: pnpm typecheck
            - name: Build
              run: pnpm build
