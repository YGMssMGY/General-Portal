apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "general-portal.fullname" . }}
  labels:
    {{- include "general-portal.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.config.port | quote }}
  APP_BASE_URL: {{ .Values.config.baseUrl | quote }}
  PG_POOL_MAX: {{ .Values.config.pgPoolMax | quote }}
  UPLOADS_DIR: {{ .Values.config.uploadsDir | quote }}
