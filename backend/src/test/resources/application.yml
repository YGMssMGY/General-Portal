spring:
  datasource:
    url: jdbc:h2:mem:general-portal-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  cache:
    type: simple
  session:
    store-type: none

general-portal:
  security:
    demo-mode: true
    auto-provision-users: true
    frontend-origin: http://localhost:5173
  seed:
    enabled: false
