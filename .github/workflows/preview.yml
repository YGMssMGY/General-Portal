name: PR preview

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read
    issues: write
    pull-requests: write

jobs:
    preview:
        runs-on: ubuntu-latest
        env:
            PREVIEW_SLUG: pr-${{ github.event.number }}
            PREVIEW_DB_URL: postgresql://preview:preview@127.0.0.1:5432/preview
            PORT: "3000"
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: preview
                    POSTGRES_PASSWORD: preview
                    POSTGRES_DB: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U preview -d postgres" --health-interval 10s --health-timeout 5s --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Provision preview site
              run: pnpm exec tsx scripts/preview.ts
            - name: Expose preview database to the app
              run: |
                  key="DATABASE_URL_$(printf '%s' "$PREVIEW_SLUG" | tr '[:lower:]-' '[:upper:]_')"
                  echo "$key=$PREVIEW_DB_URL" >> "$GITHUB_ENV"
            - name: Build and start server
              run: |
                  pnpm build
                  pnpm start > preview-server.log 2>&1 &
                  echo $! > preview-server.pid
            - name: Verify health
              run: |
                  for i in $(seq 1 30); do
                    code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/api/health" || true)
                    if [ "$code" = "200" ]; then exit 0; fi
                    sleep 2
                  done
                  cat preview-server.log
                  exit 1
            - name: Write preview summary
              if: always()
              run: |
                  {
                    echo "slug=$PREVIEW_SLUG"
                    echo "health=http://127.0.0.1:$PORT/api/health"
                  } > preview-summary.txt
                  if [ -f preview-server.log ]; then tail -n 100 preview-server.log >> preview-summary.txt; fi
            - name: Upload preview summary
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: preview-${{ github.event.number }}
                  path: preview-summary.txt
            - name: Comment preview slug
              uses: actions/github-script@v7
              with:
                  script: |
                      await github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: `Preview site slug: \`${process.env.PREVIEW_SLUG}\`. Health checked at \`http://localhost:${process.env.PORT}/api/health\`.`,
                      });
