spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/generalportal}
    username: ${POSTGRES_USER:generalportal}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
  cache:
    type: simple
  session:
    store-type: none

general-portal:
  security:
    auto-provision-users: ${GENERAL_PORTAL_AUTO_PROVISION_USERS:true}
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
    dev-auth:
      username: ${DEV_AUTH_USERNAME:dev@generalportal.local}
      password: ${DEV_AUTH_PASSWORD:}
  seed:
    enabled: ${GENERAL_PORTAL_SEED_ENABLED:true}
