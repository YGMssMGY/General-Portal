server:
  port: 8080

spring:
  application:
    name: orgflow-portal
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  cache:
    type: simple
  data:
    redis:
      repositories:
        enabled: false
  session:
    store-type: none
  security:
    oauth2:
      client:
        registration:
          microsoft:
            client-id: ${MICROSOFT_CLIENT_ID:demo-client-id}
            client-secret: ${MICROSOFT_CLIENT_SECRET:demo-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
              - User.Read
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/oauth2/v2.0/token
            jwk-set-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/discovery/v2.0/keys
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub

orgflow:
  microsoft:
    graph-base-url: ${MICROSOFT_GRAPH_BASE_URL:https://graph.microsoft.com/v1.0}
  security:
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
    auto-provision-users: ${ORGFLOW_AUTO_PROVISION_USERS:true}
    dev-auth:
      username: ${DEV_AUTH_USERNAME:}
      password: ${DEV_AUTH_PASSWORD:}
  seed:
    enabled: ${ORGFLOW_SEED_ENABLED:true}
