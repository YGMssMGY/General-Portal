name: Bug report
description: Report a reproducible problem in the portal.
title: "[Bug]: "
labels: ["bug"]
body:
    - type: markdown
      attributes:
          value: Thank you for reporting a bug. Provide enough detail for a maintainer to reproduce it.
    - type: textarea
      id: summary
      attributes:
          label: Summary
          description: What happened, and what did you expect to happen instead?
      validations:
          required: true
    - type: textarea
      id: reproduction
      attributes:
          label: Steps to reproduce
          description: List the smallest sequence of steps that reproduces the problem.
          placeholder: |
              1. Sign in as ...
              2. Open ...
              3. Observe ...
      validations:
          required: true
    - type: input
      id: portal
      attributes:
          label: Portal and workspace
          description: Which portal slug and workspace were affected?
          placeholder: developers / example-workspace
    - type: textarea
      id: environment
      attributes:
          label: Environment
          description: Browser, operating system, Node version, and deployment identifier.
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Relevant logs
          description: Paste relevant log output. Remove secrets and personal data first.
          render: shell
    - type: checkboxes
      id: checks
      attributes:
          label: Checks
          options:
              - label: I searched existing issues and found no duplicate.
                required: true
              - label: I removed secrets and personal data from logs and screenshots.
                required: true
