services:
  postgres:
    image: postgres:16
    container_name: general-portal-postgres
    environment:
      POSTGRES_DB: general_portal
      POSTGRES_USER: general_portal
      POSTGRES_PASSWORD: general_portal
    ports:
      - "5432:5432"
    volumes:
      - general-portal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U general_portal -d general_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: general-portal-redis
    ports:
      - "6379:6379"
    volumes:
      - general-portal-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  general-portal-postgres-data:
  general-portal-redis-data:
