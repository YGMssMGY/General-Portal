{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "general-portal.fullname" . }}
  labels:
    {{- include "general-portal.labels" . | nindent 4 }}
type: Opaque
{{- if or .Values.databases .Values.authSecret .Values.opsApiToken .Values.opsSecret }}
data:
  {{- range $slug, $url := .Values.databases }}
  DATABASE_URL_{{ $slug | replace "-" "_" | upper }}: {{ $url | b64enc | quote }}
  {{- end }}
  {{- with .Values.authSecret }}
  AUTH_SECRET: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.opsApiToken }}
  OPS_API_TOKEN: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.opsSecret }}
  OPS_SECRET: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
