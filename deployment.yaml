          - path: /accounts
            label: Accounts
            icon: wallet
            module: accounts
          - path: /budget
            label: Budget
            icon: piggy-bank
            module: budget
      terminology:
          subgroup: Committee
          academicYear: Academic Year
          member: Councillor
      roles: [admin, officer, member]
      seedPack: student_council
      limits:
          uploadMb: 10
          requestsPerMinute: 100
          auditRetentionDays: 365
      features: [meeting_minutes, attendance, participation, reports, custom_fields, webhooks]
      integrations:
          teamsWebhookEnv: TEAMS_WEBHOOK_URL
