name: Lighthouse CI

on:
    pull_request:
    workflow_dispatch:

concurrency:
    group: lighthouse-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lighthouse:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v7
              with:
                  node-version: 22.12
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - name: Start production server
              run: |
                  cp .env.example .env
                  pnpm start > /tmp/gp-server.log 2>&1 &
                  for i in $(seq 1 60); do
                    if curl -fsS http://localhost:3000/api/health > /dev/null; then exit 0; fi
                    sleep 1
                  done
                  cat /tmp/gp-server.log
                  exit 1
            - name: Run Lighthouse CI
              run: pnpm dlx @lhci/cli@latest autorun
            - name: Upload server log
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: lighthouse-server-log
                  path: /tmp/gp-server.log
