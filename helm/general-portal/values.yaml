nameOverride: ""
fullnameOverride: ""
replicaCount: 1
image:
    repository: general-portal
    tag: ""
    pullPolicy: IfNotPresent
imagePullSecrets: []
podAnnotations: {}
podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
securityContext:
    allowPrivilegeEscalation: false
    capabilities:
        drop:
            - ALL
    readOnlyRootFilesystem: false
service:
    type: ClusterIP
    port: 80
    targetPort: 3000
ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
        - host: portal.example.com
          paths:
              - path: /
                pathType: Prefix
    tls: []
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
config:
    port: 3000
    baseUrl: http://localhost:3000
    pgPoolMax: 10
    uploadsDir: /app/uploads
databases: {}
authSecret: ""
opsApiToken: ""
opsSecret: ""
existingSecret: ""
uploads:
    existingClaim: ""
